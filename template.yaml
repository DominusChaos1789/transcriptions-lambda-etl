AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Loads BDO SAC transcripciones JSON from the landing bucket, renames/hashes/
  encrypts columns per the bdo_sac_structure.json contract, writes a
  Hive-partitioned parquet dataset to the refined bucket, cleans up the
  source objects, and returns the per-conversation Genesys "surveys" call
  list for a downstream Step Function.

Parameters:
  EnvPrefix:
    Type: String
    Default: augusta-nexa-dev-
    Description: Prefix applied to the contract's logical bucket names (providers-landing, refined, resources).
  EnableEncryption:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Column-level KMS/AES-GCM encryption is skipped for now; set to "true" once that wiring is ready (hashing runs either way).

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.12
    Architectures: [x86_64]

Resources:
  BdoTranscripcionesEtlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bdo-transcripciones-etl
      Handler: main.handler
      CodeUri: src/
      # pyarrow ships native extensions; build with `sam build --use-container`
      # (or an equivalent manylinux build) so the wheel matches the Lambda runtime.
      Environment:
        Variables:
          ENV_PREFIX: !Ref EnvPrefix
          RESOURCES_BUCKET: !Sub "${EnvPrefix}resources"
          CONTRACT_KEY: contracts/transacciones/empatia/transcripciones/bdo_sac_structure.json
          CORE_CONFIG_KEY: params/genesys/api/core.json
          ENABLE_ENCRYPTION: !Ref EnableEncryption
      Policies:
        - Statement:
            - Sid: ReadLandingAndResources
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${EnvPrefix}providers-landing"
                - !Sub "arn:aws:s3:::${EnvPrefix}providers-landing/*"
                - !Sub "arn:aws:s3:::${EnvPrefix}resources"
                - !Sub "arn:aws:s3:::${EnvPrefix}resources/*"
            - Sid: DeleteLandingObjects
              Effect: Allow
              Action:
                - s3:DeleteObject
              Resource:
                - !Sub "arn:aws:s3:::${EnvPrefix}providers-landing/*"
            - Sid: WriteRefined
              Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub "arn:aws:s3:::${EnvPrefix}refined/*"
            # Unused while EnableEncryption is "false" (the default) -- kept
            # so flipping the flag doesn't also require a redeploy for IAM.
            - Sid: UseDataSensitiveKey
              Effect: Allow
              Action:
                - kms:GenerateDataKey
                - kms:Decrypt
              Resource: "*"
              Condition:
                ForAllValues:StringEquals:
                  kms:ResourceAliases: "alias/data-sensitive"

Outputs:
  FunctionArn:
    Value: !GetAtt BdoTranscripcionesEtlFunction.Arn
