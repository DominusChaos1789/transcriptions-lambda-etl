AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Loads BDO SAC transcripciones JSON from the landing bucket, renames
  columns per the bdo_sac_structure.json contract, writes a
  Hive-partitioned parquet dataset to the refined bucket, cleans up the
  source objects, and returns the per-conversation Genesys "surveys" call
  list for a downstream Step Function.

Parameters:
  EnvPrefix:
    Type: String
    Default: augusta-nexa-dev-
    Description: Prefix applied to the contract's logical bucket names (providers-landing, refined, resources).

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.13
    Architectures: [x86_64]

Resources:
  BdoTranscripcionesEtlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bdo-transcripciones-etl
      Handler: src.main.handler
      # CodeUri is the project root (not src/) so the built zip contains
      # src/ as a real subfolder -- required for `import src.xxx`-style
      # absolute imports and Handler `src.main.handler` to resolve. Note:
      # the actual deployment for this function goes through a separate
      # Jenkins pipeline that assembles its own zip, not `sam build`/`sam
      # deploy` -- this template documents the equivalent Handler/env/IAM
      # contract. If you do `sam build` from here, exclude test/, .venv/,
      # .git/ etc. first (SAM's default Python builder does not).
      CodeUri: .
      # duckdb ships a compiled native extension; if wheels aren't resolving
      # for the build image's Python, build with `sam build --use-container`
      # (or an equivalent manylinux build) so the wheel matches the Lambda
      # runtime. DuckDB also stages NDJSON/parquet in /tmp during the write
      # (see parquet_io.py) -- default 512 MB ephemeral storage is plenty
      # for this workload, but bump EphemeralStorage below if batches grow.
      Environment:
        Variables:
          ENV_PREFIX: !Ref EnvPrefix
          RESOURCES_BUCKET: !Sub "${EnvPrefix}resources"
          CONTRACT_KEY: contracts/transacciones/empatia/transcripciones/bdo_sac_structure.json
          CORE_CONFIG_KEY: params/genesys/api/core.json
      Policies:
        - Statement:
            - Sid: ReadLandingAndResources
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${EnvPrefix}providers-landing"
                - !Sub "arn:aws:s3:::${EnvPrefix}providers-landing/*"
                - !Sub "arn:aws:s3:::${EnvPrefix}resources"
                - !Sub "arn:aws:s3:::${EnvPrefix}resources/*"
            - Sid: DeleteLandingObjects
              Effect: Allow
              Action:
                - s3:DeleteObject
              Resource:
                - !Sub "arn:aws:s3:::${EnvPrefix}providers-landing/*"
            - Sid: WriteRefined
              Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub "arn:aws:s3:::${EnvPrefix}refined/*"

Outputs:
  FunctionArn:
    Value: !GetAtt BdoTranscripcionesEtlFunction.Arn
